        function updateTime() {
            var minutes = $("#minutes").val();
            var seconds = $("#seconds").val();
            // Ensure minutes value doesn't exceed 99 or enter NaN/null/inf
            if (minutes > 99) {
                minutes = 99;
            } else if (minutes < 0) {
                minutes = 0;
            } else if ((Number.isNaN(minutes)) || minutes === "") {
                console.warn("A non-number value was entered into Minutes!");
                minutes = 0;
            }

            // Ensure seconds value doesn't exceed 59 or enter NaN/null/inf
            if (seconds > 59) {
                seconds = 59;
            } else if (seconds < 0) {
                seconds = 0;
            } else if ((Number.isNaN(seconds)) || seconds === "") {
                console.warn("A non-number value was entered into Seconds!");
                seconds = 0;
            }
            $("#song-time").text(minutes + ":" + leftPad(seconds, 2));
        }

        function updateMedals(ext) {
            // There is a way better way to do this but I can't make it work

            } else if (which == "goldmedal") {
                elemArray[0].removeClass("toggle-off-alt-1");

                $("#dist-text").removeClass("text-bronze");
                $("#dist-text").removeClass("text-silver");
                $("#dist-text").removeClass("text-gold");
            } else {
                console.error("Fatal error on updateMedals() - Uncaught condition");

                elemArray[1].removeClass("toggle-off-alt-1");
                elemArray[2].removeClass("toggle-off-alt-1");

        function leftPad(value, length) {
            value = String(value);
            length = length - value.length;

            menubar.addClass("toggle-off-alt");
            // Hide any tooltips if they're visible
            tippy.hideAll();
            $('.toggle-off-alt-1').addClass('toggle-off-alt').removeClass('toggle-off-alt-1');
            if (songname.length == 0) {
                songname = "Untitled";
            }
            if (artistname.length == 0) {
                artistname = "Various Artists";
            }
            filename = songname + " - " + artistname + " - Bifrost.png";
            //document.documentElement.requestFullscreen();
            html2canvas(document.body, {
                allowTaint: true,
                useCORS: true,
                width: 1920,
                height: 1080,
                windowWidth: 1920,
                windowHeight: 1080
            }).then((canvas) => {
                canvas.crossOrigin = 'Anonymous'; // Potential fix for CORS check failure, might not be needed
                img = canvas.toDataURL("image/png");
                downloadURI(img, filename);
            })
            // Now re-enable the menu bar
            menubar.removeClass("toggle-off-alt");
            $('.toggle-off-alt').addClass('toggle-off-alt-1').removeClass('toggle-off-alt');
            Swal.fire({
                title: 'Just so you know',
                text: 'If the page breaks, please refresh the page.',
                icon: 'info',
                confirmButtonText: 'Ahou'
            });
        }

        function downloadURI(uri, name) {
            var link = document.createElement("a");
            link.download = name;
            link.href = uri;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            delete link;
        }
        var userData = {
            cookieAccepted: false
        }

        function closeDialog(accepted) {
            console.warn("RagnaChooser 1 and 2, as well as Bifrost V1 and V2 has reached end of life.");
            if (!accepted) {
                $("#eolnotice").hide();
            } else {
                setLocalStorage("cookie", true);
                $("#eolnotice").hide();
            }
        }

        function getLocalStorage() {
            console.log("Trying to get LocalStorage.");
            // getLocalStorage must be executed when the DOM is fully loaded
            if (localStorage.getItem("cookieAccepted") !== null) {
                userData.cookieAccepted = JSON.parse(localStorage.getItem("cookieAccepted"));
            }
        }

        function setLocalStorage(type, data) {
            console.info("Got call to write value " + data + " to " + type);
            switch (type) {
                case "cookie":
                    localStorage.setItem("cookieAccepted", JSON.stringify(data));
                    break;
                default:
                    console.error("You can't invoke setLocalStorage with null as type.");
                    break;
            }
        }
        window.onload = function() {
            initPage();
        }

        function initPage() {
            // This function must be called when DOM is loaded
            // and close the nag message before the user sees it
            getLocalStorage();
            if (userData.cookieAccepted === true) {
                closeDialog(false); // no need to set it again, just close it
            }
        }
    </script>
